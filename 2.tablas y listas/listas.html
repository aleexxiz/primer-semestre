<!DOCTYPE html>
<html lang="es">


<head>
	<meta charset="UTF-8
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content=" Nose que poner aqui ">
	<meta name="author" content="Alexis">
	<title>Etiquetas Meta</title>
</head>

<body>
	<h1> LISTAS </h1>

	<!-- Listas Desordenadas -->
	<ul>
	<!-- li va a contener el valor que nosotros le asignemos -->
		<li>Item 1</li>
		<li>Item 2</li>
		<li>Item 3</li>
		<li>Item 4</li>
	</ul>
	
	<ul>
	<!-- Los menu de navegacions usan listas-->
		<li><a href="#"> Item 1</a></li><!-- El signo # es para que no me lleve a nningun lado-->
		<!--Dentro de cada lista podemos agregar mas elementos ul, ejemplo queremos un sub menu dentro de este -->
		<li>
			<ul>
				<li>Item 1</li>
				<li>Item 2</li>
			</ul>
		</li>
	</ul>



	<!-- Listas Ordenadas -->
	<ol>
	<!-- li va a contener el valor que nosotros le asignemos -->
		<li>Item 1</li>
		<li>Item 2</li>
		<li>Item 3</li>
		<li>Item 4</li>
	</ol>
</body>

</html>
